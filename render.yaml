services:
  - type: web
    name: flower-lab
    runtime: python
    plan: free
    branch: feature/flower-agent-phase-1
    buildCommand: bash scripts/render_build.sh
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 8
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DISABLE_LLM
        value: "true"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MODEL_PACKAGE_URL
        sync: false
